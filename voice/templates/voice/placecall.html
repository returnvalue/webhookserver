<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Place Call</title>
  <style>
    :root {
      --bg: #f4f7fb;
      --card: #ffffff;
      --text: #12253b;
      --muted: #607088;
      --border: #d8e0ea;
      --btn: #0066d1;
      --btn-hover: #0154ac;
      --ok-bg: #e7f7ed;
      --ok-border: #8bc99f;
      --ok-text: #145f2d;
      --err-bg: #fbeceb;
      --err-border: #e1a1a1;
      --err-text: #8a1e1e;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "IBM Plex Sans", "Segoe UI", sans-serif;
      color: var(--text);
      background: radial-gradient(circle at top left, #ffffff 0%, var(--bg) 100%);
    }
    main {
      max-width: 620px;
      margin: 0 auto;
      padding: 2rem 1rem;
    }
    .panel {
      border: 1px solid var(--border);
      background: var(--card);
      border-radius: 12px;
      padding: 1rem;
    }
    h1 {
      margin-top: 0;
      margin-bottom: 0.3rem;
      font-size: 1.6rem;
    }
    .sub {
      margin-top: 0;
      margin-bottom: 1rem;
      color: var(--muted);
    }
    label {
      display: block;
      margin-bottom: 0.35rem;
      font-weight: 700;
    }
    input[type="text"] {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.55rem 0.6rem;
      font-size: 1rem;
      margin-bottom: 0.8rem;
    }
    button {
      border: none;
      border-radius: 8px;
      background: var(--btn);
      color: #fff;
      padding: 0.55rem 0.9rem;
      font-weight: 700;
      cursor: pointer;
    }
    button:hover { background: var(--btn-hover); }
    .msg {
      margin-top: 1rem;
      border-radius: 8px;
      padding: 0.6rem 0.75rem;
      border: 1px solid;
      font-weight: 600;
    }
    .msg.ok {
      background: var(--ok-bg);
      border-color: var(--ok-border);
      color: var(--ok-text);
    }
    .msg.err {
      background: var(--err-bg);
      border-color: var(--err-border);
      color: var(--err-text);
    }
    .links {
      margin-top: 0.9rem;
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
    }
    .links a {
      color: #005fcc;
      text-decoration: none;
      font-weight: 700;
    }
    .links a:hover { text-decoration: underline; }
  </style>
</head>
<body>
<main>
  <section class="panel">
    <h1>Place Call</h1>
    <p class="sub">Enter a destination number in E.164 format and trigger an outbound call.</p>

    <form method="post" action="/placecall">
      {% csrf_token %}
      <label for="destination">Destination Number</label>
      <input id="destination" type="text" name="destination" placeholder="+15551234567" value="{{ destination }}" required>
      <button type="submit">Call</button>
    </form>

    {% if message %}
      <div class="msg {% if is_error %}err{% else %}ok{% endif %}">{{ message }}</div>
    {% endif %}

    <div class="links">
      <a href="/">Back to Home</a>
      <a href="/events">View Events</a>
    </div>
  </section>
</main>
</body>
</html>
